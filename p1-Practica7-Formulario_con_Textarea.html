<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Textarea</title>
    <!-- Libreria de iconos en linea -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
awesome/7.3.1/css/all.min.css">
    
</head>
<body>
    <!-- Encabezado principal de la página -->
    <h2>Formulario con text area</h2>

    <!-- action="": Define a qué página se envían los datos -->
    <!-- method="post": Envía los datos del formulario de forma oculta para mayor seguridad -->
    <form action="" method="post">
        Ingresa tu nombre:
        <!-- Campo de texto normal para ingresar el nombre de usuario -->
        <input type="text" name="nombre">
        <br>

        Ingresa tu correo:
        <!-- type="email": Permite que el texto tenga formato de correo  -->
        <input type="email" name="correo">
        <br>

        Ingresa tus comentarios:
        <!-- <textarea>: Campo para textos largos. rows="4" define la altura de las filas y cols="30" el ancho (columnas) -->
        <textarea name="comentarios" rows="4" cols="30"></textarea>
        <br>

        <!-- Botón para enviar el formulario -->
        <input type="submit" value="enviar">

        <!-- Botón para limpiar todos los campos -->
        <input type="reset" value="borrar">
    </form>
</body>
</html>
