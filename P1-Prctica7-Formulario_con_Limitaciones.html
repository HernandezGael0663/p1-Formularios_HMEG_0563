<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Limitaciones</title>
</head>
<body>
    <!-- Encabezado principal de la página -->
    <h2>Formulario con limitaciones</h2>

    <!-- action="": Define a qué página se envían los datos -->
    <!-- method="post": Envía los datos del formulario de forma oculta para mayor seguridad -->
    <form action="" method="post">
        <!-- disabled: Deshabilita el campo por completo. 
             El usuario no puede escribir ni interactuar con él, y su valor NO se envía al servidor al mandar el formulario -->
        Ingresa tu nombre:
        <input type="text" name="nombre" disabled><br>

        <!-- Limitación de caracteres (máximo 5) 
         maxlength="5" es lo que define la cantidad maxima de caracteres que podras escribir-->
        Contraseña (máx. 5 caracteres):
        <input type="password" name="pass" maxlength="5"><br>

        <!-- readonly: Hace que el campo sea de "solo lectura". 
             El usuario puede ver y seleccionar el texto pero no editarlo.-->
        Comentarios:
        <textarea name="comentarios" readonly>Este es mi comentario y no se puede borrar</textarea><br>
    </form>
</body>
</html>
