<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Campos Ocultos</title>
</head>
<body>
    <!-- Encabezado principal del formulario -->
    <h2>Formulario con campos ocultos</h2>

    <!-- action="": Define a qué página se envían los datos -->
    <!-- method="post": Envía los datos del formulario de forma oculta para mayor seguridad -->
    <form action="" method="post">
        <!-- type="hidden": Campo invisible para el usuario en la pantalla.
             Se usa para enviar información interna al servidor sin interferir con la interfaz (ej.ID de usuario, hora fija, etc.). -->
             <!-- Name: Define que el dato ingresado horas, value: Define la hora -->
        <input type="hidden" name="hora" value="3:30">

        Ingresa tu nombre:
        <!-- Campo de texto normal para ingresar el nombre de usuario -->
        <input type="text" name="nombre">
        <br><br>

        <!-- Botón para enviar la información visible y la oculta al servidor -->
        <button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i></button>

        <!-- Botón para reiniciar el campo de texto -->
        <button type="reset">Borrar <i class="fa-solid fa-trash"></i></button>
    </form>
</body>
</html>
