<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo Básico</title>
</head>
<body>
 <!-- Formulario sencillo para envio de datos -->
    <h2>Ejemplo basico</h2>

    <!--  action="": Define a qué página se envían los datos  -->
    <!-- method="post": Envía los datos del formulario de forma oculta -->
    <form action="" method="post">
        Ingresa tu nombre:
        <!-- Type indica que sera tipo texto y size la cantidad de caracteres que podras ingresae -->
        <input type="text" name="nombre" size="20">
        <br>
        <!-- Boton para enviar la informacion al servidor -->
        <input type="submit" value="enviar">
    </form>
</body>
</html>
