<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Archivos</title>
</head>
<body>
    <!-- Encabezado principal de la página -->
    <h2>Formulario con archivos</h2>

    <!-- action="": Define a qué página se envían los datos -->
    <!-- method="post": Envía los datos del formulario de forma oculta para mayor seguridad -->
    <form action="" method="post">
        Ingresa tu nombre:
        <!-- Campo de texto normal para ingresar el nombre de usuario -->
        <input type="text" name="nombre">
        <br><br>

        <!-- type="file": Muestra un botón que abre el explorador de archivos del dispositivo para subir un documento -->
        <input type="file" name="archivo">
        <br><br>

        <!-- Botón de envío con ícono de avión -->
        <button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i></button>

        <!-- Botón para limpiar los campos e imagen/archivo seleccionado -->
        <button type="reset">Borrar <i class="fa-solid fa-trash"></i></button>
    </form>
</body>
</html>
